name: Publish

# Publishes to npm when a GitHub release is published. Requires an NPM_TOKEN
# repository secret (an npm automation token with publish rights).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm attach provenance to the published package

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs lint, format check, type check and tests first.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
